name: iOS build

on:
  push:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hosted runners lag behind the newest iOS. The app needs iOS 17 APIs, so any iOS 26
  # simulator is a fair test of the code.
  CI_DEPLOYMENT_TARGET: "26.0"

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      # Resources/data is the one content source. The web bundle and the iOS catalog are
      # generated from it, so they must match what is checked in.
      - name: Check generated content is up to date
        run: |
          python3 web/build_content.py
          git diff --exit-code -- web/content FreeMateIOS/Resources Resources/data || {
            echo "::error::Run python3 web/build_content.py and commit the result."
            exit 1
          }

      # The project targets iOS 27, which the runner's simulators do not have yet. Lower it
      # in the CI checkout only so the app installs on an iOS 26 simulator.
      - name: Lower the deployment target for CI
        run: |
          sed -i '' -E "s/_DEPLOYMENT_TARGET = [0-9.]+;/_DEPLOYMENT_TARGET = $CI_DEPLOYMENT_TARGET;/" FreeMateIOS.xcodeproj/project.pbxproj
          grep -c "_DEPLOYMENT_TARGET = $CI_DEPLOYMENT_TARGET;" FreeMateIOS.xcodeproj/project.pbxproj

      # A generic destination needs no concrete simulator, so the build does not depend on
      # simulator discovery.
      - name: Build app and tests
        run: |
          xcodebuild build-for-testing \
            -project FreeMateIOS.xcodeproj \
            -scheme FreeMateIOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(part) for part in re.findall(r"\d+", runtime.rsplit(".", 1)[-1])]
          for runtime in sorted((r for r in devices if ".iOS-" in r), key=version, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit()
          ')
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator is installed on this runner."
            exit 1
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      # Hosted runners sometimes leave xcodebuild blind to simulators that simctl can see
      # (actions/runner-images#12948). Refresh CoreSimulator until xcodebuild sees the device.
      - name: Run tests on the simulator
        run: |
          for attempt in 1 2 3 4 5 6; do
            if xcodebuild -showdestinations -project FreeMateIOS.xcodeproj -scheme FreeMateIOS 2>/dev/null | grep -q "id:$UDID"; then
              echo "xcodebuild sees $UDID"
              break
            fi
            echo "xcodebuild cannot see $UDID yet (attempt $attempt)"
            xcrun simctl list > /dev/null
            sleep 10
          done
          xcodebuild test-without-building \
            -project FreeMateIOS.xcodeproj \
            -scheme FreeMateIOS \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      # Debug builds open a screen from `-FreeMateScreen`, so each one can be captured.
      - name: Capture screenshots
        run: |
          APP=$(find DerivedData/Build/Products -maxdepth 2 -name FreeMateIOS.app -path "*iphonesimulator*" | head -1)
          BUNDLE_ID=com.jacobbakerpersonalteam.FreeMateIOS
          # Tests run on clones of the simulator and leave the original shut down.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          mkdir -p screenshots
          for screen in home lessons openings practice computer puzzles:level/1 review course:beginner-fundamentals lesson:piece-movement trainer:italian-game tutorial:ruy-lopez; do
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -FreeMateScreen "$screen"
            sleep 6
            xcrun simctl io "$UDID" screenshot "screenshots/$(echo "$screen" | tr ':/' '--').png"
          done

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Swift package tests
        run: swift test
