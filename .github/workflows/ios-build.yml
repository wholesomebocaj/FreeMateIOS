name: iOS build

on:
  push:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "SIM_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)" >> "$GITHUB_ENV"

      # The deployment target follows the runner's SDK so the build does not depend on
      # the newest iOS release being installed. The code itself needs iOS 17 APIs.
      - name: Build app and tests
        run: |
          xcodebuild build-for-testing \
            -project FreeMateIOS.xcodeproj \
            -scheme FreeMateIOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET="$SIM_SDK" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Run tests on a simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" in runtime:
                  for device in devices[runtime]:
                      if device["name"].startswith("iPhone"):
                          print(device["udid"])
                          sys.exit()
          ')
          xcodebuild test-without-building \
            -project FreeMateIOS.xcodeproj \
            -scheme FreeMateIOS \
            -destination "id=$DEVICE" \
            -derivedDataPath DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET="$SIM_SDK" \
            CODE_SIGNING_ALLOWED=NO

      - name: Swift package tests
        run: swift test
