name: iOS build

on:
  push:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hosted runners do not always have the newest iOS runtime installed. The app needs
  # iOS 17 APIs, so any iOS 26 simulator is a fair test of the code.
  CI_DEPLOYMENT_TARGET: "26.0"

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # `simctl` can list iPhones that the selected Xcode will not run on, for example when
      # an Xcode release expects a simulator runtime the image does not ship. Ask each
      # Xcode, newest first, for its own destinations and keep the first with a real iPhone.
      - name: Pick an Xcode with a usable iOS Simulator
        run: |
          for XCODE in $(ls -d /Applications/Xcode_*.app | sort -rV); do
            DEVICE=$(DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -showdestinations \
                -project FreeMateIOS.xcodeproj -scheme FreeMateIOS \
                IPHONEOS_DEPLOYMENT_TARGET="$CI_DEPLOYMENT_TARGET" 2>/dev/null \
              | awk '/Ineligible destinations/ { exit } /platform:iOS Simulator/ && /name:iPhone/ && !/placeholder/' \
              | head -1 | sed -E 's/.*id:([^,]+),.*/\1/')
            if [ -n "$DEVICE" ]; then
              echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
              echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
              DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version
              echo "Simulator: $DEVICE"
              exit 0
            fi
            echo "$XCODE has no usable iOS Simulator"
          done
          echo "No installed Xcode can run an iOS Simulator" >&2
          echo "::group::Diagnostics"
          xcrun simctl list runtimes
          echo "--- destinations with IPHONEOS_DEPLOYMENT_TARGET=$CI_DEPLOYMENT_TARGET"
          xcodebuild -showdestinations -project FreeMateIOS.xcodeproj -scheme FreeMateIOS \
            IPHONEOS_DEPLOYMENT_TARGET="$CI_DEPLOYMENT_TARGET" 2>&1 | tail -40
          echo "--- destinations with the project's own settings"
          xcodebuild -showdestinations -project FreeMateIOS.xcodeproj -scheme FreeMateIOS 2>&1 | tail -40
          echo "::endgroup::"
          exit 1

      - name: Build app and tests
        run: |
          xcodebuild build-for-testing \
            -project FreeMateIOS.xcodeproj \
            -scheme FreeMateIOS \
            -destination "id=$DEVICE" \
            -derivedDataPath DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET="$CI_DEPLOYMENT_TARGET" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Run tests on the simulator
        run: |
          xcodebuild test-without-building \
            -project FreeMateIOS.xcodeproj \
            -scheme FreeMateIOS \
            -destination "id=$DEVICE" \
            -derivedDataPath DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET="$CI_DEPLOYMENT_TARGET" \
            CODE_SIGNING_ALLOWED=NO

      - name: Swift package tests
        run: swift test
